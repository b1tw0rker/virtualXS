### virtualXS - Apache Response Header
###
### Setzt die HTTP-Antwort-Header, die bei einem Header-Check haeufig als
### "nicht verfuegbar" gemeldet werden:
###   Content-Type, Server, Expires, Cache-Control, Content-Length
###
### Benoetigte Module: mod_headers, mod_expires
### Wird nach /etc/httpd/conf.d/ kopiert (siehe lib/lib_httpd.sh).
###

### --- Server ------------------------------------------------------
### ServerTokens Prod liefert nur "Server: Apache" ohne Version/OS.
### Ein komplett eigener Wert ist nur mit mod_security moeglich
### (SecServerSignature, siehe security.conf).
###
ServerTokens Prod
ServerSignature Off

### --- Content-Type -------------------------------------------------
### Ohne AddDefaultCharset sendet Apache bei manchen Handlern keinen
### bzw. einen unvollstaendigen Content-Type. UTF-8 wird angehaengt.
###
AddDefaultCharset UTF-8

<IfModule mod_mime.c>
    AddType text/html                      .html .htm
    AddType text/css                       .css
    AddType text/javascript                .js .mjs
    AddType application/json               .json
    AddType image/svg+xml                  .svg .svgz
    AddType image/webp                     .webp
    AddType image/avif                     .avif
    AddType font/woff2                     .woff2
    AddType application/manifest+json       .webmanifest
</IfModule>

### --- Expires / Cache-Control --------------------------------------
### mod_expires erzeugt Expires UND Cache-Control: max-age.
### Statische Assets werden lange gecacht, HTML nur kurz.
###
<IfModule mod_expires.c>
    ExpiresActive On

    ExpiresDefault                          "access plus 1 hour"
    ExpiresByType text/html                 "access plus 0 seconds"

    ExpiresByType text/css                  "access plus 1 year"
    ExpiresByType text/javascript           "access plus 1 year"
    ExpiresByType application/javascript    "access plus 1 year"

    ExpiresByType image/jpeg                "access plus 1 year"
    ExpiresByType image/png                 "access plus 1 year"
    ExpiresByType image/gif                 "access plus 1 year"
    ExpiresByType image/webp                "access plus 1 year"
    ExpiresByType image/avif                "access plus 1 year"
    ExpiresByType image/svg+xml             "access plus 1 year"
    ExpiresByType image/x-icon              "access plus 1 year"

    ExpiresByType font/woff2                "access plus 1 year"
    ExpiresByType font/woff                 "access plus 1 year"
    ExpiresByType font/ttf                  "access plus 1 year"
</IfModule>

<IfModule mod_headers.c>

    ### Statische Assets: unveraenderlich, aggressiv cachen.
    <FilesMatch "\.(css|js|mjs|jpg|jpeg|png|gif|webp|avif|svg|svgz|ico|woff|woff2|ttf|eot)$">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </FilesMatch>

    ### Dynamische Inhalte: nie zwischenspeichern.
    <FilesMatch "\.(php|phar|cgi|pl|py)$">
        Header set Cache-Control "no-store, no-cache, must-revalidate, max-age=0"
        Header set Pragma "no-cache"
        Header unset Expires
        Header set Expires "Thu, 01 Jan 1970 00:00:00 GMT"
    </FilesMatch>

    ### HTML: kurz cachen, aber immer revalidieren.
    <FilesMatch "\.(html|htm)$">
        Header set Cache-Control "public, max-age=0, must-revalidate"
    </FilesMatch>

</IfModule>

### --- Content-Length ------------------------------------------------
### Hinweis: Content-Length fehlt zwangslaeufig, sobald die Antwort
### komprimiert (mod_deflate/mod_brotli) oder gechunkt ausgeliefert wird
### bzw. bei HTTP/2. Apache sendet dann "Transfer-Encoding: chunked"
### statt Content-Length - das ist protokollkonform und kein Fehler.
###
### Soll Content-Length fuer bestimmte Pfade erzwungen werden, muss dort
### die Komprimierung deaktiviert werden:
###
### <Location "/download">
###     SetEnv no-gzip 1
###     SetEnv no-brotli 1
### </Location>
###

### --- Module sicherstellen -------------------------------------------
### mod_headers und mod_expires werden unter Rocky/RHEL ueber
### /etc/httpd/conf.modules.d/00-base.conf geladen. Falls dort
### auskommentiert, hier aktivieren:
###
### LoadModule headers_module modules/mod_headers.so
### LoadModule expires_module modules/mod_expires.so
