; Default Securty Setting by BitWorker

session.cookie_httponly = true
session.cookie_samesite = Strict
session.cookie_secure = true

expose_php = Off

; Verhindert Anzeige von Fehlermeldungen im Browser (kein Info-Leak)
display_errors = Off
display_startup_errors = Off

; Fehler werden ins Log geschrieben statt angezeigt
log_errors = On

; Verhindert das Einbinden externer URLs via include/require (Remote File Inclusion)
allow_url_include = Off

; Verhindert das Öffnen externer URLs via fopen/file_get_contents
allow_url_fopen = Off

; Session-ID darf nicht per URL übertragen werden (Session Hijacking)
session.use_only_cookies = 1

; Verhindert Session Fixation - der Server vergibt immer eine neue Session-ID
session.use_strict_mode = 1

; Regeneriert die Session-ID beim Login (verhindert Session Fixation)
session.use_trans_sid = 0

; Ursprüngliche Liste (vor Überarbeitung durch Claude, 2026-05-24):
;disable_functions = exec,passthru,shell_exec,system,proc_open,popen,curl_exec,curl_multi_exec,parse_ini_file,show_source
;
; Überarbeitet durch Claude (claude-sonnet-4-6) am 2026-05-24:
; - curl_exec + curl_multi_exec entfernt (wird von WordPress/Plugins für externe APIs benötigt)
; - proc_close, proc_terminate, proc_get_status, proc_nice ergänzt (Ergänzung zu proc_open)
; - highlight_file ergänzt (identisch zu show_source, zeigt PHP-Quellcode)
; - phpinfo ergänzt (gibt Serverpfade, Module, PHP-Version preis)
; - putenv ergänzt (kann PATH/LD_PRELOAD manipulieren)
; - posix_kill, posix_setpgid, posix_setsid, posix_setuid, posix_setgid, posix_seteuid, posix_setegid ergänzt (Prozesse/User manipulieren)
; - pcntl_exec, pcntl_fork ergänzt (Prozesse forken/ersetzen - RCE-Eskalation)
; Überarbeitet durch Claude (claude-sonnet-4-6) am 2026-05-25:
; - shell_exec entfernt: UserAddLib.php benötigt sudo useradd/chpasswd/chown — kein PHP-Ersatz möglich.
;   shell_exec wird über FPM-Pool-Architektur gesteuert: srv010-Pool lässt es zu,
;   neue vHost-Pools müssen shell_exec explizit in ihrer disable_functions führen.
; Ueberarbeitet am 2026-09-07:
; - proc_get_status entfernt: reine Statusabfrage auf eine Prozess-Ressource, die der
;   gleiche Request zuvor selbst per proc_open erzeugt hat - kann weder fremde Prozesse
;   inspizieren noch etwas starten. Solange proc_open/shell_exec in dieser Baseline offen
;   sind, hatte die Sperre keinen Sicherheitswert, brach aber CLI-Cronjobs
;   (seofuxx-crawler.php nutzt proc_open + proc_get_status).
;   Die vHost-FPM-Pools bleiben unberuehrt: sie fuehren proc_open, proc_close und
;   proc_get_status weiterhin in ihrer eigenen php_admin_value-Liste.
; GEKLAERT (2026-09-07): proc_open und proc_close fehlen hier ABSICHTLICH - nicht
;   versehentlich. Der VirtualX-Panel-Pool (srv010.host-x.de) setzt bewusst keine eigene
;   disable_functions und erbt daher diese Baseline. Das Panel braucht proc_open/proc_close
;   fuer UserAddLib.php (User anlegen, Passwort per stdin), api/v1/system/service (systemctl)
;   und api/v1/cronjob/run. Ein Wiedereintragen wuerde diese Panel-Funktionen brechen.
;   Nur der Kommentar vom 2026-05-25 war unvollstaendig, der Wert war richtig.
;   Die vHost-Pools sperren proc_open/proc_close/shell_exec weiterhin selbst; der
;   adminx-Code dort faengt das per function_exists() sauber ab.
; ACHTUNG: /opt/virtualXS/lib/lib_php.sh ("PHP Security patch"-Schritt) kopiert
;   files/php/90-bw-security.ini ueber /etc/php.d/ und wuerde diese Datei ueberschreiben.
;   Das Template wurde am 2026-09-07 auf diesen Stand nachgezogen.
disable_functions = exec,passthru,system,popen,proc_terminate,proc_nice,parse_ini_file,show_source,highlight_file,phpinfo,putenv,posix_kill,posix_setpgid,posix_setsid,posix_setuid,posix_setgid,posix_seteuid,posix_setegid,pcntl_exec,pcntl_fork

; Verhindert dynamisches Nachladen von PHP-Extensions zur Laufzeit
enable_dl = Off

; Verhindert Info-Leak des PHP-Skriptpfads in E-Mail-Headern (X-PHP-Originating-Script)
mail.add_x_header = Off